<!DOCTYPE html>
<htmL lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Campus SnackPass</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>🍔Campus SnackPass</h1>
            <p>Skip the Queue. Grab Your Food</p>
        </header>
        <section class="categories">
            <input type="text" class="search" value="" placeholder="Hungry?">
            <button class="Sort">Sort</button>
            <button class="categories-btn">All</button>
            <button class="categories-btn">Pizza</button>
            <button class="categories-btn">Burger</button>
            <button class="categories-btn">Drinks</button>
            <button class="categories-btn">Desserts</button>
        </section>
        <section class="menu" id="menu">

        </section>
        
        <section class="cart">
            <h2> 🛒YOUR CART</h2>
            <p id="cart-items">No Items Selected</p>
            <h3>ORDER SUMMARY</h3>
            <p id="prices">TOTAL: Rs.0</p>
            <button id="clear">CLEAR CART</button>
            <button class="cnfrm-btn">Confirm Order</button>
        </section>
        <p id="message"></p>
<script src="script.js"></script>
</body>
</htmL>
